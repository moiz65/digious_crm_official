<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digious CRM Desktop setup</title>
    <style>
      body { font: 15px Segoe UI, sans-serif; margin: 28px; color: #172033; }
      label { display: block; margin: 20px 0 8px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 10px; }
      button { margin-top: 16px; padding: 9px 16px; }
      #error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h2>Connect to Digious CRM</h2>
    <p>This desktop app opens your CRM in its own window. Monitoring remains off until you sign in and explicitly consent inside the CRM.</p>
    <form id="setup-form">
      <p>CRM website: <strong>https://digious-crm.vercel.app</strong></p>
      <button type="submit">Open Digious CRM</button>
    </form>
    <p id="error" role="alert"></p>
    <script src="./setup.js"></script>
  </body>
</html>
