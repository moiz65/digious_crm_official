<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b4c"/>
      <stop offset="1" stop-color="#245b91"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77baff"/>
      <stop offset="1" stop-color="#3283d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071a30" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1095" cy="68" r="240" fill="#ffffff" opacity=".045"/>
  <circle cx="1100" cy="80" r="175" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="2"/>
  <circle cx="70" cy="600" r="235" fill="#5c9ddd" opacity=".1"/>
  <rect x="76" y="72" width="1048" height="486" rx="30" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="76" y="72" width="14" height="486" rx="7" fill="url(#accent)"/>
  <image href="digious-logo.png" x="137" y="119" width="390" height="121" preserveAspectRatio="xMinYMid meet"/>
  <rect x="137" y="280" width="88" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="137" y="359" fill="#16314f" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-.8">Digious CRM</text>
  <text x="137" y="413" fill="#53677d" font-family="Arial, Helvetica, sans-serif" font-size="25">Manage your team, attendance, and operations.</text>
  <g transform="translate(137 466)" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">
    <rect width="144" height="38" rx="19" fill="#edf5fc"/>
    <text x="72" y="25" text-anchor="middle" fill="#285d91">ATTENDANCE</text>
    <rect x="158" width="114" height="38" rx="19" fill="#edf5fc"/>
    <text x="215" y="25" text-anchor="middle" fill="#285d91">PAYROLL</text>
    <rect x="286" width="130" height="38" rx="19" fill="#edf5fc"/>
    <text x="351" y="25" text-anchor="middle" fill="#285d91">OPERATIONS</text>
  </g>
  <text x="1036" y="520" text-anchor="end" fill="#71859a" font-family="Arial, Helvetica, sans-serif" font-size="16">DIGIOUS SOLUTIONS</text>
</svg>
